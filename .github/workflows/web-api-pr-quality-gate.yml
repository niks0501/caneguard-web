name: Web/API PR quality gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: web-api-pr-quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Web/API PR quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: firstmate_ci_mysql
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout revision without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node without repository credentials
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up PHP without repository credentials
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Install Web dependencies
        run: npm ci --no-audit --no-fund

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('api/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Laravel dependencies
        run: composer install --working-dir=api --no-interaction --no-progress --prefer-dist

      - name: Verify dependency audit gate contract
        run: npm run test:quality-gate-workflow

      - name: Verify MapLibre dependency security contract
        run: npm run security:dependency-check

      - name: Audit Web dependencies (high and critical advisories fail)
        run: npm audit --audit-level=high

      - name: Audit Laravel dependencies (advisories and abandoned packages fail)
        run: composer audit --working-dir=api --locked --no-interaction --no-dev --abandoned=fail

      - name: Prepare Laravel test environment
        run: |
          cp api/.env.example api/.env
          php api/artisan key:generate --force --no-interaction

      - name: Run Web checks (lint, typecheck, tests, build)
        run: npm run check:web

      - name: Run Laravel checks (tests, formatting)
        run: npm run check:api

      - name: Prepare MySQL integration database
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: firstmate_ci_mysql
          DB_USERNAME: root
          DB_PASSWORD: ""
        run: php api/artisan migrate --force --no-interaction

      - name: Run MySQL integration suite
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: firstmate_ci_mysql
          DB_USERNAME: root
          DB_PASSWORD: ""
        run: npm run api:test:mysql

      - name: Run consumer contract suite
        run: npm run verify:contract:consumer
