  workflow_dispatch:
    inputs:
      mobile_ref:
        description: Exact 40-character mobile commit SHA to test
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-report-upload-contract-trusted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trusted-cross-repository-gate:
    name: mobile lifecycle contract gate (trusted)
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WEB_REF: ${{ github.sha }}
      MOBILE_REF_INPUT: ${{ inputs.mobile_ref }}
    steps:
      - name: Checkout exact web revision without credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node without repository credentials
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Validate exact web revision
        run: node scripts/assert-git-revision.mjs "$WEB_REF"

      - name: Validate canonical artifacts
        run: |
          npm run contract:artifact
          npm run contract:v2:artifact
          npm run contract:assignment-artifact
          npm run contract:completion-artifact
          npm run contract:notification-artifact
          npm run contract:lifecycle-artifact

      - name: Validate and resolve exact mobile revision
        id: gate-config
        run: npm run contract:config

      - name: Validate gate helper tests
        run: npm run contract:test

      - name: Install Laravel test dependencies
        run: composer install --working-dir=api --no-interaction --no-progress --prefer-dist

      - name: Validate Laravel consumer boundaries
        run: |
          npm run contract:consumer
          npm run contract:assignment-consumer
          npm run contract:completion-consumer
          npm run contract:notification-consumer
          npm run contract:lifecycle-consumer

      # This is the only step that receives the cross-repository secret.
      # This workflow is intentionally absent from pull_request and is reviewed on main before use.
      - name: Checkout exact mobile revision with read-only token
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: niks0501/caneguard-mobile
          ref: ${{ steps.gate-config.outputs.mobile_ref }}
          token: ${{ secrets.CANEGUARD_MOBILE_READ_TOKEN }}
          path: .ci/caneguard-mobile
          persist-credentials: false

      - name: Validate exact mobile revision
        run: node scripts/assert-git-revision.mjs "${{ steps.gate-config.outputs.mobile_ref }}" "$GITHUB_WORKSPACE/.ci/caneguard-mobile"

      - name: Install focused mobile test dependencies without lifecycle scripts
        working-directory: .ci/caneguard-mobile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate mobile producer domain against web artifact
        env:
          MOBILE_REPO_DIR: ${{ github.workspace }}/.ci/caneguard-mobile
          MOBILE_REF: ${{ steps.gate-config.outputs.mobile_ref }}
          CONTRACT_ARTIFACT: ${{ github.workspace }}/docs/contracts/mobile-report-upload-v2.json
        run: npm run contract:producer

      - name: Validate assignment producer domain against web artifact
        env:
          MOBILE_REPO_DIR: ${{ github.workspace }}/.ci/caneguard-mobile
          MOBILE_REF: ${{ steps.gate-config.outputs.mobile_ref }}
          ASSIGNMENT_CONTRACT_ARTIFACT: ${{ github.workspace }}/docs/contracts/mobile-field-validation-assignment-v1.json
        run: npm run contract:assignment-producer

      - name: Validate completion producer domain against web artifact
        env:
          MOBILE_REPO_DIR: ${{ github.workspace }}/.ci/caneguard-mobile
          MOBILE_REF: ${{ steps.gate-config.outputs.mobile_ref }}
          COMPLETION_CONTRACT_ARTIFACT: ${{ github.workspace }}/docs/contracts/mobile-field-validation-completion-v1.json
        run: npm run contract:completion-producer

      - name: Validate notification producer domain against web artifact
        env:
          MOBILE_REPO_DIR: ${{ github.workspace }}/.ci/caneguard-mobile
          MOBILE_REF: ${{ steps.gate-config.outputs.mobile_ref }}
          NOTIFICATION_CONTRACT_ARTIFACT: ${{ github.workspace }}/docs/contracts/mobile-notifications-v1.json
        run: npm run contract:notification-producer

      - name: Validate lifecycle producer domain against web artifact
        env:
          MOBILE_REPO_DIR: ${{ github.workspace }}/.ci/caneguard-mobile
          MOBILE_REF: ${{ steps.gate-config.outputs.mobile_ref }}
          LIFECYCLE_CONTRACT_ARTIFACT: ${{ github.workspace }}/docs/contracts/report-lifecycle-v1.json
        run: npm run contract:lifecycle-producer

      - name: Publish sanitized gate evidence
        env:
          MOBILE_REF: ${{ steps.gate-config.outputs.mobile_ref }}
        run: |
          artifact_sha256="$(sha256sum docs/contracts/mobile-report-upload-v2.json | awk '{print $1}')"
          assignment_artifact_sha256="$(sha256sum docs/contracts/mobile-field-validation-assignment-v1.json | awk '{print $1}')"
          notification_artifact_sha256="$(sha256sum docs/contracts/mobile-notifications-v1.json | awk '{print $1}')"
          lifecycle_artifact_sha256="$(sha256sum docs/contracts/report-lifecycle-v1.json | awk '{print $1}')"
          {
            echo '### Cross-repository lifecycle contract gate'
            echo
            echo "- Web revision: $WEB_REF"
            echo "- Mobile revision: $MOBILE_REF"
            echo "- Upload artifact SHA-256: $artifact_sha256"
            echo "- Assignment artifact SHA-256: $assignment_artifact_sha256"
            echo "- Notification artifact SHA-256: $notification_artifact_sha256"
            echo "- Lifecycle artifact SHA-256: $lifecycle_artifact_sha256"
            echo '- Producer result: PASS, mobile Jest contract tests evaluated all web-owned artifacts.'
            echo '- Consumer result: PASS, Laravel feature contract tests accepted all v1 boundaries.'
            echo '- Secret handling: the read-only token was supplied only to the pinned checkout action and was not exported to test processes.'
          } >> "$GITHUB_STEP_SUMMARY"
