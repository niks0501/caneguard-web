permissions:
  contents: read

concurrency:
  group: mobile-report-upload-contract-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web-boundary:
    name: lifecycle contract web boundary (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout web revision without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node without repository credentials
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Validate canonical artifacts
        run: |
          npm run contract:artifact
          npm run contract:v2:artifact
          npm run contract:assignment-artifact
          npm run contract:completion-artifact
          npm run contract:notification-artifact
          npm run contract:lifecycle-artifact

      - name: Validate pinned revision configuration
        run: npm run contract:config

      - name: Validate gate helper tests
        run: npm run contract:test

      - name: Install Laravel test dependencies
        run: composer install --working-dir=api --no-interaction --no-progress --prefer-dist

      - name: Validate Laravel consumer boundaries
        run: |
          npm run contract:consumer
          npm run contract:assignment-consumer
          npm run contract:completion-consumer
          npm run contract:notification-consumer
          npm run contract:lifecycle-consumer

      - name: Explain trusted cross-repository follow-up
        run: |
          {
            echo '### Mobile lifecycle contract PR boundary'
            echo
            echo 'Upload, assignment, completion, notification, and lifecycle artifacts plus Laravel consumer checks passed without private mobile repository credentials.'
            echo 'The cross-repository producer check runs from the separate trusted workflow only on a push to main or an explicit workflow dispatch from main.'
            echo 'A mobile producer revision must be recorded as a full SHA in ci/mobile-report-upload-gate.json or supplied to workflow_dispatch before P0F.'
          } >> "$GITHUB_STEP_SUMMARY"
