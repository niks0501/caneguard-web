
commands:
  prepare: "npm ci"
  test: "npm test -- --run src/pages/CaseReviewPage.test.tsx src/pages/CaseReviewPage.declutter.test.tsx src/pages/CaseReviewPage.contract.test.tsx src/components/reports/ReviewDecisionForm.test.tsx"

ignore_patterns:
  - "graphify-out/**"

protected_paths:
  - ".no-mistakes.yaml"
  - "api/database/migrations/**"
  - ".github/workflows/**"

document:
  instructions: |
    README.md owns setup; PROJECT_CHECKS.md owns verification commands.
    PROJECT_STACK.md owns architecture guidance.
    docs/ owns workflows and integration contracts.
    api/docs/ owns backend-specific documentation.

review:
  conversation: false
  path_instructions:
    - path: "api/app/Http/**"
      instructions: "Enforce server-side authorization and validation; preserve error and response contracts."
    - path: "api/routes/**"
      instructions: "Preserve route permissions, HTTP semantics and existing API consumers."
    - path: "api/database/migrations/**"
      instructions: "Preserve existing records and schema compatibility; flag destructive migrations."
    - path: "src/auth/**"
      instructions: "Preserve session restoration, logout and role-gated routing; client guards do not replace server authorization."

test:
  instructions: |
    Use PROJECT_CHECKS.md to select affected Vitest, Laravel or consumer-contract tests; full suites belong in CI.
    No interactive checks in no-mistakes; explicitly authorized browser acceptance uses npm run dev -- --host 127.0.0.1 --port <free-port> --strictPort.
    For authorized live API acceptance, start Laravel per README.md with isolated firstmate_ test data; never production/shared databases.
    Browser-compatible Web/HTTP evidence cannot prove Mobile native behavior; backend-only changes need no browser.
    Record revision, commands and actual evidence; unavailable required evidence is inconclusive, defects are no-go.
