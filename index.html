<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="196x196" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CaneGuard municipal workspace for reviewing submitted sugarcane field observations."
    />
    <title>CaneGuard | Submitted Reports</title>
    <script>
      // Adopt the stored appearance before the first paint, so a dark choice
      // never flashes the paper surface while the app module loads. This is the
      // one declaration `src/theme/themePreference.ts` cannot make early enough;
      // keep the storage key, version and values in step with that module.
      (function () {
        try {
          var stored = JSON.parse(
            window.localStorage.getItem("caneguard.appearance.preferences")
          );
          if (
            stored &&
            stored.version === 1 &&
            (stored.theme === "paper" || stored.theme === "dark")
          ) {
            document.documentElement.dataset.theme = stored.theme;
          }
        } catch (error) {
          // Blocked or corrupt storage falls through to the paper stylesheet.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
